services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: seguritygab-backend:latest
    container_name: seguritygab-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_DISABLED=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: seguritygab-frontend:latest
    container_name: seguritygab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
