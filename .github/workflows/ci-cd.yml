name: CI/CD & Docker Packages Pipeline - SegurityGAB

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # 1. BACKEND CI (NestJS)
  # ==========================================
  backend-ci:
    name: Backend CI (Lint, Build, Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: npm ci

      - name: 🔍 Run ESLint Linter
        run: npm run lint

      - name: 🏗️ Build Backend (NestJS)
        run: npm run build

      - name: 🧪 Run Backend Test Suite (Smoke, Unit, White-box, Integration, Black-box)
        run: npm run test:ci
        env:
          NODE_ENV: test
          DB_DISABLED: 'true'
          JWT_SECRET: ci_test_jwt_secret_key_12345

  # ==========================================
  # 2. FRONTEND CI (Next.js & React)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Unit Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🧪 Run Frontend Unit & Integration Tests (Jest)
        run: npm run test:ci

      - name: 🏗️ Build Frontend (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}

  # ==========================================
  # 3. DOCKER BUILD & PUBLISH TO GITHUB PACKAGES (GHCR)
  # ==========================================
  docker-publish:
    name: 🐳 Build & Push ${{ matrix.name }} to GitHub Packages
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend Docker Image
            service: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: Frontend Docker Image
            service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          flavor: |
            lower=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
